name: Release

# Cutting a release: push an annotated tag (``git tag -a v0.1.0 -m "..."``).
# The tag builds the two artifacts this project ships by hand -- the Windows
# executable and the Linux bundle -- smoke-tests both *as built*, and attaches
# them to the GitHub release.  A release that cannot start and render its own
# window never makes it out of here.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"
  # Every smoke run happens without a display: the app renders offscreen and
  # proves it with a PNG.
  QT_QPA_PLATFORM: "offscreen"

jobs:
  verify-version:
    name: tag matches the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Install the project
        run: uv sync --frozen
      - name: The tag has to be the version the app reports
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          reported="$(uv run --frozen python -m spacesage --version | awk '{print $2}')"
          tag="${GITHUB_REF_NAME#v}"
          case "$reported" in
            "$tag" | "$tag".dev* | "$tag"+*) ;;
            *)
              echo "::error::tag ${GITHUB_REF_NAME} does not match version ${reported}"
              exit 1
              ;;
          esac
          echo "tag ${GITHUB_REF_NAME} matches version ${reported}"

  windows:
    name: windows exe
    needs: verify-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Install the project and PyInstaller
        run: uv sync --frozen --extra build
      - name: Build the windowed single file
        run: >-
          uv run --frozen --extra build pyinstaller packaging/spacesage.spec
          --noconfirm --distpath dist --workpath build/pyinstaller
      - name: The exe starts and reports its Qt platform
        run: dist\spacesage.exe --self-check
      - name: The exe renders its window
        env:
          SPACESAGE_DATA_DIR: ${{ runner.temp }}\spacesage-smoke
        run: dist\spacesage.exe --capture artifacts\package\smoke-windows.png --capture-delay 1500
      - name: Upload the exe and its proof
        uses: actions/upload-artifact@v7.0.1
        with:
          name: spacesage-windows-x86_64
          path: |
            dist/spacesage.exe
            artifacts/package/smoke-windows.png
          if-no-files-found: error

  linux:
    name: linux bundle
    needs: verify-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Install the project and PyInstaller
        run: uv sync --frozen --extra build
      - name: Install Qt's runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libglvnd0 libxkbcommon0 libdbus-1-3
      - name: Build the one-file app
        run: >-
          uv run --frozen --extra build pyinstaller packaging/spacesage.spec
          --noconfirm --distpath dist --workpath build/pyinstaller
      - name: The bundle starts and renders its window
        env:
          SPACESAGE_DATA_DIR: ${{ runner.temp }}/spacesage-smoke
        run: |
          ./dist/spacesage --self-check
          ./dist/spacesage --capture artifacts/package/smoke-linux.png --capture-delay 1500
          test "$(stat -c %s artifacts/package/smoke-linux.png)" -ge 20000
      - name: Bundle the binary with the license
        run: |
          mkdir -p dist/bundle
          cp dist/spacesage LICENSE dist/bundle/
          tar -czf "dist/spacesage-linux-x86_64.tar.gz" -C dist/bundle .
      - name: Upload the bundle and its proof
        uses: actions/upload-artifact@v7.0.1
        with:
          name: spacesage-linux-x86_64
          path: |
            dist/spacesage-linux-x86_64.tar.gz
            artifacts/package/smoke-linux.png
          if-no-files-found: error

  release:
    name: publish
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Fetch the built artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts
      - name: List what is about to be published
        run: find artifacts -type f -printf '%p (%s bytes)\n'
      - name: Publish the release
        uses: softprops/action-gh-release@v3.0.3
        with:
          generate_release_notes: true
          files: |
            artifacts/spacesage-windows-x86_64/spacesage.exe
            artifacts/spacesage-windows-x86_64/smoke-windows.png
            artifacts/spacesage-linux-x86_64/spacesage-linux-x86_64.tar.gz
            artifacts/spacesage-linux-x86_64/smoke-linux.png
