name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  # The GUI suite runs on the Qt "offscreen" platform: no display, real renders
  # (screenshots are captured with widget.grab()).
  QT_QPA_PLATFORM: "offscreen"

jobs:
  # Lint runs once: ruff is interpreter-independent, and the OS x Python matrix
  # below is where cross-platform regressions actually show up.
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Install the project
        run: uv sync --frozen
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Check formatting
        run: uv run --frozen ruff format --check .

  mypy:
    name: mypy (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install the project
        # --python pins the venv to the matrix interpreter: without it uv sync
        # picks its own default and a leg would type-check another Python.
        run: uv sync --frozen --python ${{ matrix.python-version }}
      - name: Type check (strict)
        run: uv run --frozen mypy spacesage

  pytest:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
        # 3.11 note: the locked PySide6 corrupts the reference counts of CPython's
        # singletons on Python->C++ calls, which drained them and aborted the
        # interpreter during finalization *after* an all-green summary (exit 134).
        # The test session and the app itself park them out of reach
        # (tests/qt_shutdown_guard.py, spacesage/app/qt_shutdown_guard.py), so this
        # leg's exit code means what it says; docs/verification.md has the
        # measurements.
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install the project
        # --python pins the venv to the matrix interpreter: without it uv sync
        # picks its own default and a leg would silently test another Python.
        run: uv sync --frozen --python ${{ matrix.python-version }}
      - name: Install Qt's runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libglvnd0 libxkbcommon0 libdbus-1-3
      - name: Run tests
        # tests/e2e is the acceptance pass: it plants a disk of its own and runs
        # the whole pipeline out of process, so it has a job of its own (below)
        # instead of running on every matrix leg.
        #
        # The output is kept in a file so the next step can raise the failing
        # tests as annotations: a red run has to say what failed.  The exit
        # code lands in the file too -- a run that dies without its final
        # summary (a native crash, not a pytest verdict) tells a different
        # story from a run whose tests failed, and both are in here.
        #
        # No -r on this command line: pytest resolves -r across config and
        # command line by *replacing*, so a CLI -rs would silently drop the
        # configured -ra and red runs would lose their FAILED lines
        # (observed in runs 35751310380 and 35753550883).  The config's
        # -ra already covers failures, errors, skips and xfail entries.
        shell: bash
        run: |
          set -o pipefail
          uv run --frozen pytest --ignore=tests/e2e -q --color=no 2>&1 | tee pytest-output.txt
          code=$?
          printf 'PYTEST EXIT CODE: %s\n' "$code" >> pytest-output.txt
          exit "$code"
      - name: Annotate the failures
        # GitHub caps each annotation level at ten per step, so the errors go
        # most-telling-first.  The step summary carries the long form: without
        # it the runner's fatal message and the interpreter die with the log,
        # and a red run has to say *why*.
        if: failure()
        shell: bash
        run: |
          uv run --frozen python -VV | sed 's/^/::notice::/' || true
          grep -E '^SKIPPED' pytest-output.txt | head -9 | sed 's/^/::notice::/' || true
          {
            echo "### pytest diagnostics"
            echo '```'
            uv run --frozen python -VV || true
            grep -E '^PYTEST EXIT CODE' pytest-output.txt || true
            grep -E '^=+ .*(passed|failed|error|no tests)' pytest-output.txt | tail -2 || true
            grep -n -A28 -m1 'FAILURES' pytest-output.txt || true
            grep -inE 'fatal|abort|INTERNALERROR|traceback' pytest-output.txt | tail -6 || true
            echo '--- last 30 lines ---'
            tail -30 pytest-output.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          {
            grep -E '^PYTEST EXIT CODE' pytest-output.txt || true
            grep -E '^=+ .*(passed|failed|error|no tests)' pytest-output.txt | tail -1 || true
            grep -E '^(FAILED|ERROR) ' pytest-output.txt | head -6 || true
            grep -inE 'fatal|abort|INTERNALERROR' pytest-output.txt | tail -1 || true
            tail -2 pytest-output.txt || true
          } | head -10 | sed 's/^/::error::/'
          grep -E '^(FAILED|ERROR) ' pytest-output.txt | tail -n +7 | head -8 | sed 's/^/::warning::/' || true

  # The acceptance pass (S12): one planted "full disk" driven through every
  # engine stage and through the app itself, out of process, the way a user and
  # CI run it.  It is heavy (about a gigabyte of scratch, a couple of minutes)
  # and POSIX-shaped (real symlinks, a target on a second volume), so it gets one
  # Linux leg.  The renders and the demo plan it produces are uploaded as
  # evidence -- they are the same files the slice's report links to.
  e2e:
    name: e2e (full-disk acceptance pass)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install the project
        run: uv sync --frozen --python "3.13"
      - name: Install Qt's runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libglvnd0 libxkbcommon0 libdbus-1-3
      - name: Run the acceptance pass
        shell: bash
        run: |
          set -o pipefail
          uv run --frozen pytest tests/e2e -q --color=no 2>&1 | tee pytest-output.txt
          code=$?
          printf 'PYTEST EXIT CODE: %s\n' "$code" >> pytest-output.txt
          exit "$code"
      - name: Annotate the failures
        # Same shape as the matrix legs: the step summary carries the long
        # form, the annotations carry the first ten most-telling lines.
        if: failure()
        shell: bash
        run: |
          uv run --frozen python -VV | sed 's/^/::notice::/' || true
          grep -E '^SKIPPED' pytest-output.txt | head -9 | sed 's/^/::notice::/' || true
          {
            echo "### acceptance-pass diagnostics"
            echo '```'
            uv run --frozen python -VV || true
            grep -E '^PYTEST EXIT CODE' pytest-output.txt || true
            grep -E '^=+ .*(passed|failed|error|no tests)' pytest-output.txt | tail -2 || true
            grep -n -A28 -m1 'FAILURES' pytest-output.txt || true
            grep -inE 'fatal|abort|INTERNALERROR|traceback' pytest-output.txt | tail -6 || true
            echo '--- last 30 lines ---'
            tail -30 pytest-output.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          {
            grep -E '^PYTEST EXIT CODE' pytest-output.txt || true
            grep -E '^=+ .*(passed|failed|error|no tests)' pytest-output.txt | tail -1 || true
            grep -E '^(FAILED|ERROR) ' pytest-output.txt | head -6 || true
            grep -inE 'fatal|abort|INTERNALERROR' pytest-output.txt | tail -1 || true
            tail -2 pytest-output.txt || true
          } | head -10 | sed 's/^/::error::/'
          grep -E '^(FAILED|ERROR) ' pytest-output.txt | tail -n +7 | head -8 | sed 's/^/::warning::/' || true
      - name: Upload the evidence
        # Evidence is most valuable exactly when the pass failed, so it goes up
        # either way.
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: spacesage-e2e-evidence
          path: artifacts/e2e
          if-no-files-found: error

  # The packaging smoke build: the spec has to keep working, so it is built and
  # *run* on every push -- a bundle that starts, renders its window and proves it
  # with a PNG is the only evidence that counts.  Both platforms are covered:
  # linux here, windows in its own job below (the release workflow builds the
  # same pair again, from the tag).
  package:
    name: package (linux smoke build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Install the project and PyInstaller
        run: uv sync --frozen --extra build
      - name: Install Qt's runtime libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libglvnd0 libxkbcommon0 libdbus-1-3
      - name: Build the one-file app
        run: >-
          uv run --frozen --extra build pyinstaller packaging/spacesage.spec
          --noconfirm --distpath dist --workpath build/pyinstaller
      - name: The bundle starts (Qt probe through the packaged binary)
        run: ./dist/spacesage --self-check
      - name: The bundle renders its window
        env:
          SPACESAGE_DATA_DIR: ${{ runner.temp }}/spacesage-smoke
        run: ./dist/spacesage --capture artifacts/package/smoke.png --capture-delay 1500
      - name: The render has to be a real window, not an empty frame
        run: test "$(stat -c %s artifacts/package/smoke.png)" -ge 20000
      - name: Upload the bundle and its proof
        uses: actions/upload-artifact@v7.0.1
        with:
          name: spacesage-linux-x86_64
          path: |
            dist/spacesage
            artifacts/package/smoke.png
          if-no-files-found: error

  # The same proof for the exe: a --windowed one-file build that cannot start or
  # render on the platform it ships for is a broken release artifact, and a tag
  # is too late and too rare a place to find that out.  The render runs on the
  # NATIVE platform (the offscreen plugin does not rasterize text on Windows),
  # and every number lands in the run's annotations -- exit codes and PNG sizes
  # are readable without the login-walled logs.
  package-windows:
    name: package (windows smoke build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Install the project and PyInstaller
        run: uv sync --frozen --extra build
      - name: Build the windowed single file
        run: >-
          uv run --frozen --extra build pyinstaller packaging/spacesage.spec
          --noconfirm --distpath dist --workpath build/pyinstaller
      - name: The exe starts under both platforms
        run: |
          & dist\spacesage.exe --self-check
          echo "::notice::self-check offscreen exit=$LASTEXITCODE"
          $env:QT_QPA_PLATFORM = "windows"
          $direct = (& dist\spacesage.exe --self-check 2>&1 | Out-String).Trim()
          $code = $LASTEXITCODE
          cmd /c "dist\spacesage.exe --self-check > selfcheck-native.txt 2>&1"
          $file = ((Get-Content selfcheck-native.txt -Raw) -replace "\r?\n", " | ").Trim()
          echo "::notice::self-check native exit=$code direct=[$direct] file=[$file]"
      - name: The exe renders under both platforms
        env:
          SPACESAGE_DATA_DIR: ${{ runner.temp }}\spacesage-smoke
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          & dist\spacesage.exe --capture artifacts\package\smoke-offs.png --capture-delay 1000
          $offsCode = $LASTEXITCODE
          $offsSize = if (Test-Path artifacts\package\smoke-offs.png) { (Get-Item artifacts\package\smoke-offs.png).Length } else { -1 }
          $env:QT_QPA_PLATFORM = "windows"
          & dist\spacesage.exe --capture artifacts\package\smoke-win.png --capture-delay 1500
          $winCode = $LASTEXITCODE
          $winSize = if (Test-Path artifacts\package\smoke-win.png) { (Get-Item artifacts\package\smoke-win.png).Length } else { -1 }
          echo "::notice::capture offscreen exit=$offsCode png=$offsSize native exit=$winCode png=$winSize"
          if ($winCode -ne 0) { throw "the native capture exited $winCode" }
          if ($winSize -lt 20000) { throw "the native render is too small to contain text ($winSize bytes)" }
      - name: Any crash report the exe left behind
        if: failure()
        run: |
          $dir = "${{ runner.temp }}\spacesage-smoke\logs"
          if (Test-Path $dir) {
            Get-ChildItem $dir -Filter crash-*.log | Sort-Object LastWriteTime | Select-Object -Last 1 |
              ForEach-Object {
                echo "::warning::crash log $($_.Name):"
                Get-Content $_.FullName | Select-Object -First 2 | ForEach-Object { echo "::warning::$_" }
                Get-Content $_.FullName -Tail 15 | ForEach-Object { echo "::warning::$_" }
              }
          } else {
            echo "::warning::no crash-log directory at $dir"
          }
      - name: Upload the exe and both renders
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: spacesage-windows-smoke
          path: |
            artifacts/package/smoke-offs.png
            artifacts/package/smoke-win.png
          if-no-files-found: warn
